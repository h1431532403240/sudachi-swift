# Codecov settings. The codecov job in .github/workflows/build.yml uploads
# two coverage reports: rust/src/lib.rs (flag "rust", from cargo llvm-cov in
# the build job) and Sources/SudachiSwift/SudachiSwift.swift (flag "swift",
# from `swift test --enable-code-coverage` in the test job). It also uploads
# the Swift tests' results (JUnit XML, flag "swift") for Test Analytics,
# which needs no settings here (flaky-test detection is on by default).
# Check changes before committing:
#   curl --data-binary @codecov.yml https://codecov.io/validate

# Notify about coverage (statuses, PR comment) once per commit, after both
# uploads: without this, Codecov notifies after the first upload and edits
# everything after the second. With it, coverage notifications wait for the
# codecov job's last step, the CLI's send-notifications, which it runs even
# when the Swift report is missing. Remove this line together with that step.
# Test results don't wait for it: once Codecov has processed them, it posts
# failed tests to the PR comment (and then sends no coverage statuses or
# comment for the commit), or, when none failed, sends the coverage
# notifications by itself, possibly before that step does and from a partial
# report (a coverage upload not yet processed counts with its carried-forward
# numbers).
codecov:
  notify:
    manual_trigger: true

# Informational for now: the statuses never fail, so no PR (including the
# automated sudachi.rs bumps) is blocked on coverage.
# On Codecov's free Developer plan, which this repository uses, Codecov posts
# only codecov/patch; the project block takes effect only on a plan with
# project coverage (e.g. Pro). It stays for that case. Tighten later there,
# e.g. `threshold: 1%` on project.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Regular expressions matched against repo-relative paths. The reports only
# name the two files above; these keep anything else out if that changes.
ignore:
  - "Sources/SudachiSwift/sudachi_swift\\.swift"  # generated UniFFI bindings
  - "sudachi\\.rs"                                # upstream submodule
  - "Examples"
  - "tests"                                       # Swift tests, SPM consumer fixture
  - "scripts"

# One flag per report. carryforward keeps the last Swift numbers on commits
# where only the Rust report arrives (the test job failed, for example).
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: rust
      paths:
        - rust/src/
    - name: swift
      paths:
        - Sources/SudachiSwift/

component_management:
  individual_components:
    - component_id: rust_wrapper
      name: Rust wrapper (UniFFI)
      paths:
        - rust/src/**
    - component_id: swift_extensions
      name: Swift extensions
      paths:
        - Sources/SudachiSwift/SudachiSwift.swift

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default       # edit one comment instead of posting new ones
  # Stay quiet on PRs that don't change coverage. (Failed tests are posted
  # to the same comment regardless.)
  require_changes: true

# Line annotations on the PR diff: Codecov is deprecating them, and they
# don't work with flags or components anyway.
github_checks:
  annotations: false
