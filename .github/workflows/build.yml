name: Build XCFramework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the upstream-check automation run CI on its bump branch: pull_request
  # runs for PRs opened with GITHUB_TOKEN wait for approval, but a dispatch
  # sent with GITHUB_TOKEN starts a run right away.
  workflow_dispatch:

permissions:
  contents: read

# Every `uses:` is pinned to a full commit SHA (comment: the tag or branch it
# was taken from).
env:
  # Rust toolchain, pinned so CI builds with what release.yml ships with.
  # Keep in sync with release.yml, which explains how to bump it.
  RUST_STABLE: "1.98.1"
  # Fail instead of silently installing an unpinned toolchain when something
  # asks rustup for one that isn't installed (e.g. `cargo +stable`).
  RUSTUP_AUTO_INSTALL: "0"
  # cargo-llvm-cov for the Rust coverage report, pinned like cargo-swift so a
  # new release can't change CI unannounced (0.9.x needs rustc 1.87+).
  # Swatinem/rust-cache hashes CARGO_* variables into its key, so bumping
  # this starts a fresh cache that holds the new binary.
  CARGO_LLVM_COV_VERSION: "0.9.1"

jobs:
  build:
    # macos-14 is being retired (brownouts from 2026-10-05, removed 2026-11-02:
    # https://github.com/actions/runner-images/issues/13518). macos-15 is the
    # oldest supported image, so CI keeps covering the oldest Xcode it can
    # (16.4 by default).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false # nothing below uses git credentials

      # The dtolnay/rust-toolchain SHA is its `stable` branch (the same one
      # check-upstream.yml pins); `toolchain:` overrides that branch's default.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          # Every platform's targets (scripts/build-local.sh builds them all).
          # No x86_64-apple-tvos: it is Tier 3, so the tvOS Simulator slice is
          # arm64 only, like visionOS's.
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios-macabi,x86_64-apple-ios-macabi,aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-visionos,aarch64-apple-visionos-sim
          # llvm-cov and llvm-profdata matching this rustc, for cargo-llvm-cov.
          # Installed here because RUSTUP_AUTO_INSTALL=0 stops anything from
          # fetching it later.
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        # Runs before the cargo-swift and cargo-llvm-cov installs: rust-cache
        # leaves out anything already in ~/.cargo/bin when it starts, so this
        # order lets the pinned tools be cached, and on later runs
        # `cargo install` finds them already installed.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Install cargo-swift (version pinned in scripts/build-local.sh)
        run: |
          CARGO_SWIFT_VERSION=$(sed -n 's/^CARGO_SWIFT_VERSION="\([^"]*\)"$/\1/p' scripts/build-local.sh)
          if [ -z "$CARGO_SWIFT_VERSION" ]; then
            echo "::error file=scripts/build-local.sh::CARGO_SWIFT_VERSION not found"
            exit 1
          fi
          cargo install cargo-swift --version "$CARGO_SWIFT_VERSION" --locked

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked

      - name: Run Rust unit tests (with coverage)
        # The tests in rust/src/tests.rs, including dictionary-format
        # detection tests that read sudachi.rs/sudachi/tests/resources from
        # the submodule. cargo llvm-cov builds them with coverage
        # instrumentation (in its own target dir) and fails the step if a
        # test fails, like `cargo test`. --locked: rust/Cargo.lock is tracked,
        # so CI fails instead of silently resolving different dependency
        # versions.
        # The report covers rust/src/lib.rs only: sudachi.rs is not a member
        # of this workspace, and cargo-llvm-cov leaves out files named
        # tests.rs. The coverage job uploads coverage/rust.lcov to Codecov;
        # the table on the run's summary page needs no third party.
        working-directory: rust
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage"
          cargo llvm-cov --locked --no-report
          cargo llvm-cov report --locked --lcov --output-path "$GITHUB_WORKSPACE/coverage/rust.lcov"
          # llvm-cov writes absolute paths; Codecov matches repo-relative
          # ones (rust/src/lib.rs) against the repository without `fixes:`.
          perl -pi -e 's#^SF:\Q$ENV{GITHUB_WORKSPACE}\E/#SF:#' "$GITHUB_WORKSPACE/coverage/rust.lcov"
          if grep -q '^SF:/' "$GITHUB_WORKSPACE/coverage/rust.lcov"; then
            echo "::error::coverage/rust.lcov still has absolute paths outside $GITHUB_WORKSPACE:"
            grep '^SF:/' "$GITHUB_WORKSPACE/coverage/rust.lcov"
            exit 1
          fi
          # The table goes to the log and to the summary page. (set -e: a
          # failing report fails the step at the assignment.)
          report="$(cargo llvm-cov report --locked)"
          echo "$report"
          {
            echo '### Rust coverage (cargo llvm-cov)'
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: coverage/rust.lcov
          if-no-files-found: error

      - name: Build XCFramework + stage bindings (all platforms)
        run: ./scripts/build-local.sh

      - name: Run Swift tests (macOS)
        # tests/SudachiSwiftTests: the hand-written Swift API, errors and
        # fields crossing the FFI boundary, bundled resources, dictionary
        # discovery. Root Package.swift uses ./SudachiSwift.xcframework only if
        # it exists; otherwise it silently downloads the last published
        # release, and this would test that binary instead of this build.
        # The end-to-end tests need SUDACHI_DICT_PATH and skip here; the test
        # job runs them with the pinned dictionary.
        run: |
          set -euo pipefail
          if [ ! -f SudachiSwift.xcframework/Info.plist ]; then
            echo "::error::SudachiSwift.xcframework/Info.plist not found at the repo root; build-local.sh's output moved, so the tests would run against the published binary."
            ls -la . 2>&1 || true
            exit 1
          fi
          swift test

      - name: Verify root Package.swift via SPM consumer fixture
        # Builds and runs tests/spm-consumer/ against root Package.swift with a
        # local binaryTarget. Building catches the v0.1.0 class of bug where
        # the package's binary surface is missing symbols an external SPM user
        # would need; running does the fixture's dictionary-free runtime checks
        # (e.g. rule-based splitting after an ASCII quote, a leading U+FEFF
        # surviving the trip back from Rust) and exits non-zero on a failure.
        run: |
          set -euo pipefail
          cp Package.swift Package.swift.bak
          python3 -c "
          import re, pathlib
          p = pathlib.Path('Package.swift')
          p.write_text(re.sub(
              r'\.binaryTarget\(\s*name:\s*\"SudachiSwiftFFI\",[^)]*\)',
              '.binaryTarget(name: \"SudachiSwiftFFI\", path: \"SudachiSwift.xcframework\")',
              p.read_text(), count=1, flags=re.DOTALL))
          "
          ( cd tests/spm-consumer && swift run Verify )
          mv Package.swift.bak Package.swift

      - name: Verify iOS Simulator build
        # A generic destination needs only the iOS Simulator SDK, not a
        # particular simulated device, so it doesn't depend on which simulators
        # the runner image ships. (There is no "iPhone 17" simulator on macos-14,
        # or with macos-15's default Xcode 16.4.)
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

      - name: Verify Mac Catalyst build
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -skipPackagePluginValidation

      - name: Run Swift tests (Mac Catalyst)
        # The same tests against the Mac Catalyst slice (`swift test` links
        # the macOS one), with the resource bundle as Xcode builds it. The
        # SudachiSwift scheme includes the test target. Catalyst runs on the
        # runner itself, so no simulator is needed. The arm64 runner matches
        # both an arm64 and an x86_64 (Rosetta) Catalyst destination, so name
        # the native one instead of letting xcodebuild pick the first match
        # (with a "multiple matching destinations" warning). The generic
        # "Verify Mac Catalyst build" step above builds both architectures.
        run: |
          xcodebuild test \
            -scheme SudachiSwift \
            -destination 'platform=macOS,variant=Mac Catalyst,arch=arm64' \
            -skipPackagePluginValidation

      - name: Verify tvOS build
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=tvOS' \
            -skipPackagePluginValidation

      - name: Verify tvOS Simulator build (arm64)
        # The tvOS and visionOS Simulator slices are arm64 only (Rust's
        # x86_64 tvOS target is Tier 3, and there is no x86_64 visionOS
        # target). A generic simulator destination also builds x86_64, which
        # can't link, so build arm64 only, as the README tells users to.
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=tvOS Simulator' \
            -skipPackagePluginValidation \
            ARCHS=arm64

      - name: Verify visionOS build
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=visionOS' \
            -skipPackagePluginValidation

      - name: Verify visionOS Simulator build (arm64)
        # arm64 only; see the tvOS Simulator step.
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=visionOS Simulator' \
            -skipPackagePluginValidation \
            ARCHS=arm64

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SudachiSwift.xcframework
          path: SudachiSwift.xcframework

      - name: Upload staged bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SudachiSwift-bindings
          path: Sources/SudachiSwift/sudachi_swift.swift

  notices:
    # A job of its own, so a stale file doesn't hide the build and test
    # results: an upstream bump (new sudachi.rs commit, crate versions) always
    # needs a regeneration, which the bump PR's checklist asks for.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false # nothing below uses git credentials

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Check THIRD_PARTY_NOTICES.md is up to date
        # The script regenerates it from rust/Cargo.lock and the sudachi.rs
        # submodule (cargo fetch + cargo metadata, no build) and fails if the
        # committed file differs: run
        # `python3 scripts/generate-third-party-notices.py` and commit it.
        run: python3 scripts/generate-third-party-notices.py --check

  test:
    runs-on: macos-15
    needs: build
    env:
      # Test dictionaries, pinned by version + sha256 so a new SudachiDict
      # upload can't change or break CI. To bump the dictionary, change the
      # version and both sha256 values together (here and in release.yml);
      # the cache keys below are built from them, so they change by themselves.
      # sudachi.rs 0.7+ reads only V1-format dictionaries, so the test
      # dictionary comes from the V1 CDN path (the "v1" argument to
      # scripts/fetch-test-dictionary.sh). It is the full one (the largest
      # vocabulary, so the end-to-end tests see more of what apps load,
      # e.g. morphemes that split into subunits); its 137 MB zip is cached.
      # (The old job looked up SudachiDict's latest GitHub release, but those
      # releases no longer carry the dictionary zips.)
      SUDACHI_DICT_VERSION: "20260723"
      SUDACHI_DICT_V1_FULL_SHA256: eb6d02206e93f1b62508c9f2d4d4940d6f82c7f63c630bc0c1c4f9c50b7e871e
      # Legacy V0 build of the same release, used only to check it is
      # rejected, so the small one is enough.
      SUDACHI_DICT_V0_SHA256: 4729d134fd0b9852dacc89c59229664fee40642bb52bafcf4efb432cee9bb22c

    steps:
      # No submodules: this job builds no Rust (the XCFramework comes from
      # the build job), and scripts/fetch-test-dictionary.sh replaced
      # sudachi.rs/fetch_dictionary.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below uses git credentials

      - name: Download XCFramework artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SudachiSwift.xcframework
          path: SudachiSwift.xcframework

      - name: Download Swift bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SudachiSwift-bindings
          path: Sources/SudachiSwift

      - name: Check the XCFramework artifact is at the repo root
        # Root Package.swift uses ./SudachiSwift.xcframework only if it exists;
        # otherwise it silently downloads the last published release, and
        # everything below would test that binary instead of this build.
        run: |
          if [ ! -f SudachiSwift.xcframework/Info.plist ]; then
            echo "::error::SudachiSwift.xcframework/Info.plist not found at the repo root; the artifact layout changed, so the tests would run against the published binary."
            ls -la . SudachiSwift.xcframework 2>&1 || true
            exit 1
          fi

      # The dictionary zips (V1 full, 137 MB; V0 small, 42 MB) are cached
      # between runs, one entry per zip. An entry never changes once saved
      # (a run that restores it doesn't save it again), so a shared entry
      # saved while one zip was missing would stay without it; with separate
      # entries, each zip is saved only once it has been verified, and a
      # missing one is simply tried again on the next run. Each key holds the
      # runner OS, the dictionary version and that zip's sha256 pin, so a
      # changed pin starts a new entry for that zip only. It also holds the
      # hash of scripts/fetch-test-dictionary.sh, which decides where under
      # CACHE_DIR the zip goes: an entry saved by an older script could hold
      # it where the current one doesn't look, and as a restored entry is
      # never saved again, every run would download the zip. Any change to
      # the script starts new entries, at the cost of one download per zip.
      # No restore-keys: an older entry holds an older zip, which the save
      # step would only carry along into the new entry.
      # Entries saved on main can be restored on every branch (PRs, and the
      # check-upstream bump branches that dispatch this workflow); entries
      # saved on another branch only there. GitHub evicts entries that go
      # unused for 7 days.
      # A restored zip gets no more trust than a download: the fetch script
      # checks its sha256 either way. (release.yml doesn't use this cache;
      # see the note there.)
      - name: Restore the cached V1 test dictionary
        id: dict-v1-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Outside the workspace, where fetch-test-dictionary.sh keeps V1
          # zips (CACHE_DIR/v1). The save step must use the same path: it is
          # part of what an entry is matched on.
          path: ${{ runner.temp }}/sudachidict-zips/v1
          key: sudachidict-${{ runner.os }}-${{ env.SUDACHI_DICT_VERSION }}-v1-full-${{ env.SUDACHI_DICT_V1_FULL_SHA256 }}-${{ hashFiles('scripts/fetch-test-dictionary.sh') }}

      - name: Fetch the V1 test dictionary
        # V1 full -> ./system.dic at the repo root, where SUDACHI_DICT_PATH
        # points for the Swift tests and BasicUsage. The script downloads the
        # zip only when the cache didn't have it, and fails on a sha256
        # mismatch, cached or not.
        run: ./scripts/fetch-test-dictionary.sh "$SUDACHI_DICT_VERSION" full v1 "$SUDACHI_DICT_V1_FULL_SHA256" "$RUNNER_TEMP/sudachidict-zips" "$GITHUB_WORKSPACE/system.dic"

      - name: Save the V1 test dictionary to the cache
        # Right after the fetch, so a failing test below doesn't cost the next
        # run the download. Only on a miss (an existing entry is never
        # replaced), and only with a verified zip: this step doesn't run when
        # the fetch step failed.
        if: steps.dict-v1-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sudachidict-zips/v1
          key: ${{ steps.dict-v1-cache.outputs.cache-primary-key }}

      - name: Restore the cached V0 test dictionary
        id: dict-v0-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # CACHE_DIR/v0; as for V1, the save step must use the same path.
          path: ${{ runner.temp }}/sudachidict-zips/v0
          key: sudachidict-${{ runner.os }}-${{ env.SUDACHI_DICT_VERSION }}-v0-small-${{ env.SUDACHI_DICT_V0_SHA256 }}-${{ hashFiles('scripts/fetch-test-dictionary.sh') }}

      - name: Fetch the V0 test dictionary
        id: dict-v0
        # Legacy V0 small -> dict-v0/system.dic for the rejection check.
        # If upstream stops serving the V0 fixture (the script exits 1), skip
        # that check with a warning instead of failing CI for an unrelated
        # reason; nothing is cached then, so the next run tries again.
        # A cached zip that fails its sha256 check (exit 3) fails the job
        # instead: every run restores the same entry, so a warning would skip
        # the check for good.
        env:
          DICT_V0_CACHE_KEY: ${{ steps.dict-v0-cache.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          status=0
          ./scripts/fetch-test-dictionary.sh "$SUDACHI_DICT_VERSION" small v0 "$SUDACHI_DICT_V0_SHA256" "$RUNNER_TEMP/sudachidict-zips" "$GITHUB_WORKSPACE/dict-v0/system.dic" || status=$?
          case "$status" in
            0)
              echo "fetched=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "::warning::Could not fetch the V0 fixture dictionary; skipping the legacy-format check."
              ;;
            3)
              echo "::error::The cached V0 fixture zip doesn't match SUDACHI_DICT_V0_SHA256. Delete the cache entry (gh cache delete '$DICT_V0_CACHE_KEY') and run again."
              exit 1
              ;;
            *)
              echo "::error::scripts/fetch-test-dictionary.sh exited with $status."
              exit 1
              ;;
          esac

      - name: Save the V0 test dictionary to the cache
        # Only on a miss, and only when the fetch step verified the zip.
        if: steps.dict-v0-cache.outputs.cache-hit != 'true' && steps.dict-v0.outputs.fetched == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sudachidict-zips/v0
          key: ${{ steps.dict-v0-cache.outputs.cache-primary-key }}

      - name: Run Swift tests with the test dictionary (with coverage)
        # The build job's suite again, this time including the end-to-end
        # tests, which load the real dictionary from SUDACHI_DICT_PATH (and
        # fail, not skip, if it isn't a V1 file). Uses this build's XCFramework
        # (checked above) and bindings.
        # Coverage covers the hand-written Swift layer only: the XCFramework
        # is a release build without coverage instrumentation, and the
        # generated bindings (sudachi_swift.swift) are left out. The coverage
        # job uploads coverage/swift.lcov to Codecov; the table on the run's
        # summary page needs no third party.
        env:
          SUDACHI_DICT_PATH: ${{ github.workspace }}/system.dic
        run: |
          set -euo pipefail
          swift test --enable-code-coverage
          # Where SwiftPM keeps the merged profile and the test bundle depends
          # on the toolchain (.build/arm64-apple-macosx/debug and
          # SudachiSwiftPackageTests.xctest with Swift 6.1;
          # .build/out/Products/Debug and SudachiSwiftTests.xctest with 6.4),
          # so ask SwiftPM instead of hard-coding them.
          profdata="$(dirname "$(swift test --enable-code-coverage --show-codecov-path)")/default.profdata"
          bundles=("$(swift build --show-bin-path)"/*.xctest)
          if [ "${#bundles[@]}" -ne 1 ] || [ ! -d "${bundles[0]}" ] || [ ! -f "$profdata" ]; then
            echo "::error::Expected one .xctest bundle and $profdata; found: ${bundles[*]}"
            exit 1
          fi
          binary="${bundles[0]}/Contents/MacOS/$(basename "${bundles[0]}" .xctest)"
          # In the log, so a toolchain layout change shows up without a rerun.
          echo "Coverage profile: $profdata"
          echo "Test binary: $binary"
          # Files under Sources/SudachiSwift only (not the tests or .build's
          # generated accessors), minus the generated bindings.
          llvm_cov_args=(-instr-profile "$profdata" "$binary" -ignore-filename-regex '/sudachi_swift\.swift$' "$GITHUB_WORKSPACE/Sources/SudachiSwift")
          mkdir -p coverage
          xcrun llvm-cov export -format=lcov "${llvm_cov_args[@]}" > coverage/swift.lcov
          # Repo-relative paths (Sources/SudachiSwift/SudachiSwift.swift), as
          # for the Rust report.
          perl -pi -e 's#^SF:\Q$ENV{GITHUB_WORKSPACE}\E/#SF:#' coverage/swift.lcov
          if ! grep -q '^SF:' coverage/swift.lcov || grep -q '^SF:/' coverage/swift.lcov; then
            echo "::error::coverage/swift.lcov lists no files, or absolute paths outside $GITHUB_WORKSPACE:"
            grep '^SF:' coverage/swift.lcov || true
            exit 1
          fi
          {
            echo '### Swift coverage (llvm-cov)'
            echo '```'
            xcrun llvm-cov report "${llvm_cov_args[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Swift coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-swift
          path: coverage/swift.lcov
          if-no-files-found: error

      - name: Run BasicUsage example
        run: |
          cd Examples/BasicUsage
          SUDACHI_DICT_PATH="../../system.dic" swift run BasicUsage

      - name: Check that a legacy V0 dictionary is rejected
        # A real V0 file must be refused up front with a "legacy V0" message,
        # not a confusing char.def/parse error. Checked twice: BasicUsage's
        # dictionaryFormat(path:) pre-check, and the library itself, via the
        # tests/spm-consumer fixture calling Tokenizer.create on the file (it
        # exits non-zero unless the error says "uses the legacy V0 format", or
        # if one of its dictionary-free checks, also run in the build job,
        # fails against this artifact).
        # Skipped when "Fetch the V0 test dictionary" couldn't get the V0
        # fixture (it left a warning).
        if: steps.dict-v0.outputs.fetched == 'true'
        run: |
          set -euo pipefail
          cd Examples/BasicUsage
          status=0
          SUDACHI_DICT_PATH="../../dict-v0/system.dic" swift run BasicUsage > ../../v0-run.log 2>&1 || status=$?
          cat ../../v0-run.log
          if [ "$status" -eq 0 ]; then
            echo "::error::BasicUsage accepted a V0 dictionary; expected a 'legacy V0' error."
            exit 1
          fi
          if ! grep -qF "legacy V0" ../../v0-run.log; then
            echo "::error::BasicUsage failed on the V0 dictionary, but without the 'legacy V0' message."
            exit 1
          fi
          echo "BasicUsage rejected the V0 dictionary as expected."

          # Library path: builds against ./SudachiSwift.xcframework (checked
          # above) and fails the step unless Tokenizer.create throws the V0 error.
          cd "$GITHUB_WORKSPACE/tests/spm-consumer"
          SUDACHI_V0_DICT_PATH="$GITHUB_WORKSPACE/dict-v0/system.dic" swift run Verify

  coverage:
    # Uploads the lcov reports of the build and test jobs to Codecov, then
    # tells it to notify (see the last step). The only job with an id-token
    # (the upload credential), and it runs no project or third-party build
    # code; build and test keep a read-only token.
    # Needs a successful build (the Rust report); runs when the test job
    # failed too, uploading the Swift report only if it exists.
    needs: [build, test]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # OIDC upload: Codecov accepts a GitHub-signed token for this repo, so
      # no CODECOV_TOKEN secret is stored. Fork PRs get no id-token; the
      # action detects them and uploads without a token, which Codecov
      # accepts from forks of public repositories.
      id-token: write
    env:
      # The action downloads the Codecov CLI at run time ("latest" by
      # default) and checks its signature; pin it like the other tools, and
      # bump it together with the action.
      CODECOV_CLI_VERSION: v11.3.1

    steps:
      # The CLI reads the commit and the repository's file list from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing below uses git credentials

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      # fail_ci_if_error: false and continue-on-error, so a Codecov outage
      # doesn't turn a PR (or an upstream bump) red; the reports stay on each
      # run's summary page. fail_ci_if_error only covers the action's upload
      # script, and the action's earlier step that fetches the OIDC token
      # fails on its own (a GitHub-side hiccup, say), hence continue-on-error
      # on all three Codecov steps.
      # disable_search + files + plugins: noop upload exactly these reports,
      # with repo-relative paths already (see the build and test jobs).
      - name: Upload Rust coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/rust.lcov
          disable_search: true
          plugins: noop
          flags: rust
          name: rust
          version: ${{ env.CODECOV_CLI_VERSION }}
          disable_telem: true
          fail_ci_if_error: false

      - name: Upload Swift coverage to Codecov
        if: ${{ hashFiles('coverage/swift.lcov') != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/swift.lcov
          disable_search: true
          plugins: noop
          flags: swift
          name: swift
          version: ${{ env.CODECOV_CLI_VERSION }}
          disable_telem: true
          fail_ci_if_error: false

      # codecov.yml sets `notify: manual_trigger`, so Codecov posts statuses
      # and the PR comment only when this step says the uploads are done:
      # once, instead of after the Rust upload and again after the Swift one.
      # It runs when there was no Swift report, and (!cancelled()) even when
      # an upload step failed: if it doesn't run, nothing is posted for this
      # commit. Codecov itself waits for uploads still being processed.
      # A fork PR has no OIDC token, and unlike uploads this call isn't
      # accepted without one unless the Codecov org's Global Upload Token
      # setting is "Not required"; otherwise the PR gets no statuses or
      # comment (its reports still show on codecov.io).
      - name: Tell Codecov the uploads are done
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          run_command: send-notifications
          use_oidc: true
          version: ${{ env.CODECOV_CLI_VERSION }}
          disable_telem: true
          fail_ci_if_error: false
