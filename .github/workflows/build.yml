name: Build XCFramework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install cargo-swift
        run: cargo install cargo-swift

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build XCFramework + stage bindings (macOS + iOS)
        run: ./scripts/build-local.sh

      - name: Verify root Package.swift via SPM consumer fixture
        # Builds tests/spm-consumer/ against root Package.swift with a local
        # binaryTarget. Catches the v0.1.0 class of bug where the package's
        # binary surface is missing symbols an external SPM user would need.
        run: |
          set -euo pipefail
          cp Package.swift Package.swift.bak
          python3 -c "
          import re, pathlib
          p = pathlib.Path('Package.swift')
          p.write_text(re.sub(
              r'\.binaryTarget\(\s*name:\s*\"SudachiSwiftFFI\",[^)]*\)',
              '.binaryTarget(name: \"SudachiSwiftFFI\", path: \"SudachiSwift.xcframework\")',
              p.read_text(), count=1, flags=re.DOTALL))
          "
          ( cd tests/spm-consumer && swift build )
          mv Package.swift.bak Package.swift

      - name: Verify iOS Simulator build
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: SudachiSwift.xcframework
          path: SudachiSwift.xcframework

      - name: Upload staged bindings
        uses: actions/upload-artifact@v4
        with:
          name: SudachiSwift-bindings
          path: Sources/SudachiSwift/sudachi_swift.swift

  build-tier3:
    runs-on: macos-14
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install cargo-swift
        run: cargo install cargo-swift

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build XCFramework (All Platforms)
        env:
          NIGHTLY: "1"
          PLATFORMS: "macos ios tvos visionos"
        run: ./scripts/build-local.sh

      - name: Upload Tier 3 XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: SudachiSwift-Tier3.xcframework
          path: SudachiSwift.xcframework
          if-no-files-found: ignore

  test:
    runs-on: macos-14
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download XCFramework artifact
        uses: actions/download-artifact@v4
        with:
          name: SudachiSwift.xcframework
          path: SudachiSwift.xcframework

      - name: Download Swift bindings
        uses: actions/download-artifact@v4
        with:
          name: SudachiSwift-bindings
          path: Sources/SudachiSwift

      - name: Download test dictionary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh api repos/WorksApplications/SudachiDict/releases/latest --jq '.tag_name')
          VERSION=${LATEST_TAG#v}
          echo "Downloading SudachiDict $VERSION (tag: $LATEST_TAG)"
          curl -L -o dict.zip "https://github.com/WorksApplications/SudachiDict/releases/download/${LATEST_TAG}/sudachi-dictionary-${VERSION}-small.zip"
          unzip -o dict.zip
          find . -name "*.dic" -type f | head -1 | xargs -I {} cp {} system.dic

      - name: Run BasicUsage example
        run: |
          cd Examples/BasicUsage
          SUDACHI_DICT_PATH="../../system.dic" swift run BasicUsage
