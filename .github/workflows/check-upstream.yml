name: Check Upstream Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve latest upstream tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/WorksApplications/sudachi.rs/releases/latest --jq '.tag_name')
          echo "Latest upstream release: $LATEST"

          CURRENT_SHA=$(git -C sudachi.rs rev-parse HEAD)
          LATEST_SHA=$(git -C sudachi.rs rev-parse "refs/tags/${LATEST}" 2>/dev/null || true)

          if [ -z "$LATEST_SHA" ]; then
            git -C sudachi.rs fetch origin --tags
            LATEST_SHA=$(git -C sudachi.rs rev-parse "refs/tags/${LATEST}")
          fi

          CURRENT_VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          LATEST_VERSION=${LATEST#v}

          echo "Pinned submodule SHA: $CURRENT_SHA"
          echo "Latest tag SHA: $LATEST_SHA"
          echo "Wrapper Cargo.toml version: $CURRENT_VERSION"

          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_SHA" != "$LATEST_SHA" ] || [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump submodule to latest upstream tag
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git -C sudachi.rs fetch origin --tags
          git -C sudachi.rs checkout "${{ steps.check.outputs.latest }}"

          # Sync wrapper Cargo.toml version to upstream
          sed -i "s/^version = \".*\"/version = \"${{ steps.check.outputs.latest_version }}\"/" rust/Cargo.toml

      - name: Open PR with submodule bump
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/bump-sudachi-${{ steps.check.outputs.latest_version }}
          commit-message: "chore: bump sudachi.rs to ${{ steps.check.outputs.latest }}"
          title: "chore: bump sudachi.rs to ${{ steps.check.outputs.latest }}"
          labels: upstream-update
          body: |
            Upstream sudachi.rs released **${{ steps.check.outputs.latest }}**.

            - Bumps the `sudachi.rs` submodule to tag `${{ steps.check.outputs.latest }}`
            - Syncs `rust/Cargo.toml` version `${{ steps.check.outputs.current_version }}` → `${{ steps.check.outputs.latest_version }}`

            If CI passes, merging this and triggering the `Release` workflow will publish
            `v${{ steps.check.outputs.latest_version }}` of SudachiSwift.

            Release notes: https://github.com/WorksApplications/sudachi.rs/releases/tag/${{ steps.check.outputs.latest }}
