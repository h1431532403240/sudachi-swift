name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.7.0)'
        required: true
        type: string

permissions:
  contents: write

# One release at a time: a later dispatch waits for the running one instead
# of racing its pushes (GitHub keeps only the newest pending dispatch), and a
# second dispatch of the same version is then stopped by the tag check in the
# validate step.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Same image as build.yml; macos-14 is being retired
    # (https://github.com/actions/runner-images/issues/13518).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate version, branch and tag
        # Everything here is known before the ~20 minute build, so fail fast.
        env:
          # Passed via env so the raw input is never spliced into the script.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in format X.Y.Z (e.g., 0.7.0), got '$VERSION'"
            exit 1
          fi

          # getVersion() reports the crate version, so the tag must match it.
          # (Only the [package] section; a dependency table can have its own
          # `version = ` line.)
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' rust/Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error file=rust/Cargo.toml::Input version $VERSION does not match rust/Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

          # The stable push fast-forwards main (see "Commit and tag stable
          # release"), so the release commit must be built from main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch Release from main (got $GITHUB_REF)"
            exit 1
          fi

          # A re-run for a version that is already tagged would fail at
          # `git tag` after the build; a published tag is never moved.
          for TAG in "v$VERSION" "v$VERSION-nightly"; do
            REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
            if [ -n "$REMOTE_TAG" ] || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; bump rust/Cargo.toml for a new release, or see the recovery notes in release.yml if v$VERSION's release is incomplete"
              exit 1
            fi
          done

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version: $VERSION"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install cargo-swift (version pinned in scripts/build-local.sh)
        # +stable: the nightly step above made nightly the default toolchain.
        run: |
          CARGO_SWIFT_VERSION=$(sed -n 's/^CARGO_SWIFT_VERSION="\([^"]*\)"$/\1/p' scripts/build-local.sh)
          if [ -z "$CARGO_SWIFT_VERSION" ]; then
            echo "::error file=scripts/build-local.sh::CARGO_SWIFT_VERSION not found"
            exit 1
          fi
          cargo +stable install cargo-swift --version "$CARGO_SWIFT_VERSION" --locked

      # No Swatinem/rust-cache here: caches on the default branch can be written
      # by jobs that run unreviewed build scripts (check-upstream's probe), and
      # this job publishes binaries, so it always builds from a clean target dir.
      - name: Check rust/Cargo.lock is up to date
        run: cargo +stable metadata --locked --format-version 1 --manifest-path rust/Cargo.toml > /dev/null

      # ===========================================
      # Build Stable (iOS + macOS)
      # ===========================================
      - name: Use stable toolchain for build
        run: rustup default stable

      - name: Build stable XCFramework + stage bindings
        run: ./scripts/build-local.sh

      - name: Snapshot stable artifacts
        # Nightly build below clobbers SudachiSwift.xcframework + the staged
        # bindings; stash them so we can restore without a third build.
        run: |
          mkdir -p .stable-stash
          cp -R SudachiSwift.xcframework .stable-stash/SudachiSwift.xcframework
          cp Sources/SudachiSwift/sudachi_swift.swift .stable-stash/sudachi_swift.swift

      - name: Package stable XCFramework
        run: |
          zip -r SudachiSwift.xcframework.zip SudachiSwift.xcframework
          CHECKSUM=$(swift package compute-checksum SudachiSwift.xcframework.zip)
          echo "STABLE_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "Stable checksum: $CHECKSUM"

      # The tag pushed below pins this zip's checksum in Package.swift, and a
      # rebuild can't reproduce it (zip records file mtimes), so keep the exact
      # bytes before anything is pushed.
      #
      # Recovery if a later step fails after the tag push (for example the
      # GitHub Release step), leaving vX.Y.Z tagged without its asset. Don't
      # re-run this workflow: the validate step refuses an existing tag, and a
      # new build would not match the tagged checksum. Instead:
      #   gh run download <run-id> -n release-vX.Y.Z-stable
      #   swift package compute-checksum SudachiSwift.xcframework.zip
      #     (must equal `let checksum` in Package.swift at tag vX.Y.Z)
      #   gh release create vX.Y.Z SudachiSwift.xcframework.zip --verify-tag --generate-notes
      #     (or `gh release upload vX.Y.Z SudachiSwift.xcframework.zip` if the
      #     release exists but has no asset)
      # The nightly zip below is kept the same way (see its recovery note).
      - name: Keep stable zip for recovery
        uses: actions/upload-artifact@v7
        with:
          name: release-v${{ env.VERSION }}-stable
          path: SudachiSwift.xcframework.zip
          if-no-files-found: error
          # Already a zip.
          compression-level: 0

      # ===========================================
      # Publish stable: tag, then the GitHub Release right away, so the
      # binaryTarget URL in the tagged Package.swift resolves before the
      # (slow, optional) nightly build starts.
      # ===========================================
      - name: Update Package.swift for stable release
        run: |
          sed -i '' "s/let version = \".*\"/let version = \"$VERSION\"/" Package.swift
          sed -i '' "s/let checksum = \".*\"/let checksum = \"$STABLE_CHECKSUM\"/" Package.swift

          echo "Updated Package.swift for stable:"
          head -20 Package.swift

      - name: Commit and tag stable release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Package.swift \
                  Sources/SudachiSwift/Resources/ \
                  Sources/SudachiSwift/sudachi_swift.swift
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          # Atomic: if main moved since checkout, neither main nor the tag is
          # updated (a plain `git push origin main --tags` would still push the
          # tag while main is rejected).
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Create stable GitHub Release
        # The body recommends `exact:` because upstream sudachi.rs 0.x releases
        # may change behavior even in patch releases; revisit once sudachi.rs
        # reaches 1.0.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: SudachiSwift.xcframework.zip
          fail_on_unmatched_files: true
          body: |
            ## SudachiSwift v${{ env.VERSION }}

            Swift bindings for sudachi.rs Japanese morphological analyzer.

            ### Installation

            **Stable (iOS + macOS):**
            ```swift
            .package(url: "https://github.com/${{ github.repository }}", exact: "${{ env.VERSION }}")
            ```
            Pin the exact version: upstream sudachi.rs 0.x releases may change tokenization behavior even in patch releases.

            **Dictionary:** a V1-format SudachiDict dictionary is required; legacy V0 dictionaries are rejected. See [Dictionary Setup](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#dictionary-setup), and [Upgrading from 0.6.x](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#upgrading-from-06x) if you are coming from 0.6.

            **tvOS / visionOS:** when the Rust nightly build succeeds, a separate `v${{ env.VERSION }}-nightly` prerelease is published under [Releases](https://github.com/${{ github.repository }}/releases).

            ### Checksum
            - Stable: `${{ env.STABLE_CHECKSUM }}`

          generate_release_notes: true

      # ===========================================
      # Build Nightly (All Platforms) - May fail
      # ===========================================
      - name: Build nightly XCFramework (all platforms)
        id: nightly-build
        continue-on-error: true
        env:
          NIGHTLY: "1"
          PLATFORMS: "macos ios tvos visionos"
        run: ./scripts/build-local.sh

      - name: Package nightly XCFramework
        if: steps.nightly-build.outcome == 'success'
        run: |
          mv SudachiSwift.xcframework SudachiSwift-nightly.xcframework
          zip -r SudachiSwift-nightly.xcframework.zip SudachiSwift-nightly.xcframework
          CHECKSUM=$(swift package compute-checksum SudachiSwift-nightly.xcframework.zip)
          echo "NIGHTLY_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "NIGHTLY_AVAILABLE=true" >> "$GITHUB_ENV"
          echo "Nightly checksum: $CHECKSUM"

      # Same reason as "Keep stable zip for recovery". If the nightly tag was
      # pushed but its prerelease step failed:
      #   gh run download <run-id> -n release-vX.Y.Z-nightly
      #   swift package compute-checksum SudachiSwift-nightly.xcframework.zip
      #     (must equal `let checksum` in Package.swift at tag vX.Y.Z-nightly)
      #   gh release create vX.Y.Z-nightly SudachiSwift-nightly.xcframework.zip \
      #     --verify-tag --prerelease --latest=false
      - name: Keep nightly zip for recovery
        if: env.NIGHTLY_AVAILABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-v${{ env.VERSION }}-nightly
          path: SudachiSwift-nightly.xcframework.zip
          if-no-files-found: error
          compression-level: 0

      - name: Mark nightly as unavailable
        if: steps.nightly-build.outcome != 'success'
        run: |
          echo "NIGHTLY_AVAILABLE=false" >> "$GITHUB_ENV"
          echo "Nightly build failed, skipping nightly release"

      - name: Restore stable artifacts from snapshot
        # Puts the stable build's generated bindings back, so the nightly tag
        # differs from the stable release commit only in Package.swift (the
        # "Same sources as vX.Y.Z" in the prerelease notes).
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          rm -rf SudachiSwift.xcframework
          cp -R .stable-stash/SudachiSwift.xcframework SudachiSwift.xcframework
          cp .stable-stash/sudachi_swift.swift Sources/SudachiSwift/sudachi_swift.swift

      # ===========================================
      # Create nightly tag + prerelease (if build succeeded)
      # ===========================================
      - name: Update Package.swift for nightly release
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          sed -i '' "s/let version = \".*\"/let version = \"$VERSION-nightly\"/" Package.swift
          sed -i '' "s/let checksum = \".*\"/let checksum = \"$NIGHTLY_CHECKSUM\"/" Package.swift
          sed -i '' "s/SudachiSwift.xcframework.zip/SudachiSwift-nightly.xcframework.zip/" Package.swift

          echo "Updated Package.swift for nightly:"
          head -20 Package.swift

      - name: Commit and tag nightly release
        # The nightly commit lives only on its tag: it is committed on a
        # detached HEAD (child of the stable release commit) and only the tag
        # is pushed. main stays on the stable release commit, so there is no
        # "restore Package.swift" commit, and commits that land on main during
        # the nightly build can't make this push fail halfway.
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          git checkout --detach
          git add Package.swift Sources/SudachiSwift/sudachi_swift.swift
          git commit -m "chore: release v$VERSION-nightly"
          git tag "v$VERSION-nightly"
          git push origin "refs/tags/v$VERSION-nightly"

      - name: Create nightly GitHub prerelease
        # The nightly tag's Package.swift downloads
        # releases/download/v<version>-nightly/SudachiSwift-nightly.xcframework.zip,
        # so the asset must live on a release for that tag (pushed above).
        if: env.NIGHTLY_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}-nightly
          prerelease: true
          make_latest: false
          files: SudachiSwift-nightly.xcframework.zip
          fail_on_unmatched_files: true
          body: |
            ## SudachiSwift v${{ env.VERSION }}-nightly

            Same sources as [v${{ env.VERSION }}](https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}), with the XCFramework built by the Rust nightly compiler (`-Z build-std`) so it also covers tvOS and visionOS.

            **Nightly (iOS, macOS, tvOS, visionOS):**
            ```swift
            .package(url: "https://github.com/${{ github.repository }}", exact: "${{ env.VERSION }}-nightly")
            ```
            > ⚠️ Nightly builds use Rust nightly compiler and may be unstable

            A V1-format dictionary is required, as for the stable release.

            ### Checksum
            - Nightly: `${{ env.NIGHTLY_CHECKSUM }}`
