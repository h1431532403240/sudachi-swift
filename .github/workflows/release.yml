name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.7.0)'
        required: true
        type: string

# Read-only unless a job asks for more. Only `publish` gets a write token, and
# it runs no third-party build code (see the notes on each job).
permissions:
  contents: read

# One release at a time: a later dispatch waits for the running one instead
# of racing its pushes (GitHub keeps only the newest pending dispatch), and a
# second dispatch of the same version is then stopped by the tag check in the
# validate step.
concurrency:
  group: release
  cancel-in-progress: false

# Every `uses:` is pinned to a full commit SHA (comment: the tag or branch it
# was taken from), since this workflow can push to main and publish releases.
env:
  # Rust toolchain, pinned so the shipped binary doesn't depend on which Rust
  # is current on the day of the run. Keep in sync with build.yml. To bump:
  # change both files in one PR, and release once build.yml passes on it.
  # Every platform builds with it, so a new version must still ship the
  # standard library of every target the "Install Rust" steps list.
  RUST_STABLE: "1.98.1"
  # Fail instead of silently installing an unpinned toolchain when something
  # asks rustup for one that isn't installed (e.g. `cargo +stable`).
  RUSTUP_AUTO_INSTALL: "0"

# Recovery. The tag pins the zip's checksum in Package.swift and a rebuild
# can't reproduce it (zip records file mtimes), so `build` keeps the exact
# zip as an artifact: release-vX.Y.Z-xcframework.
# - `build` failed, or `publish` failed before "Push release commit and tag":
#   nothing was pushed, so dispatch the release again. If only
#   `publish` failed, "Re-run failed jobs" also works and skips the rebuild:
#   the re-run uses the build job's outputs and artifacts. (If main moved
#   meanwhile, its atomic push is refused; dispatch again from the new main.)
# - vX.Y.Z was pushed but its GitHub Release is missing or has no asset. Don't
#   re-run: validation refuses an existing tag, and a new build would not
#   match the tagged checksum. Instead:
#     gh run download <run-id> -n release-vX.Y.Z-xcframework
#     shasum -a 256 SudachiSwift.xcframework.zip
#       (the same value as `swift package compute-checksum`; must equal
#       `let checksum` in Package.swift at tag vX.Y.Z)
#     gh release create vX.Y.Z SudachiSwift.xcframework.zip --verify-tag --generate-notes
#       (or `gh release upload vX.Y.Z SudachiSwift.xcframework.zip` if the
#       release exists but has no asset)

jobs:
  # ===========================================
  # build: validate the inputs, then build and smoke test the XCFramework
  # and hand the results to `publish` as artifacts. It runs crates.io build
  # scripts (the cargo-swift install and the build), so its token is
  # read-only and kept out of .git/config, and it pushes nothing. Whatever
  # those scripts do to this runner (git hooks or config, downloaded action
  # code) stays here: `publish` runs on a fresh one.
  # ===========================================
  build:
    # Same image as build.yml; macos-14 is being retired
    # (https://github.com/actions/runner-images/issues/13518).
    runs-on: macos-15
    # The build (11 Rust targets, every platform) plus the smoke tests.
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      # Only a hint for `publish`, which re-validates it (this job ran
      # third-party code) and recomputes the checksum itself.
      version: ${{ steps.validate.outputs.version }}
    env:
      # Smoke-test dictionaries: the same pins as build.yml's test job (keep
      # the three values in sync with it).
      SUDACHI_DICT_VERSION: "20260723"
      SUDACHI_DICT_V1_SHA256: f7778a7945ea653154fd61636ad42365f797cddf04123953c1fae1e897cd3b59
      SUDACHI_DICT_V0_SHA256: 4729d134fd0b9852dacc89c59229664fee40642bb52bafcf4efb432cee9bb22c

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit `publish` checks out again and releases on top of.
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          # Nothing in this job uses git credentials.
          persist-credentials: false

      - name: Validate version, branch and tag
        id: validate
        # Everything here is known before the ~20 minute build, so fail fast.
        # `publish` repeats these checks before it pushes.
        env:
          # Passed via env so the raw input is never spliced into the script.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in format X.Y.Z (e.g., 0.7.0), got '$VERSION'"
            exit 1
          fi

          # getVersion() reports the crate version, so the tag must match it.
          # (Only the [package] section; a dependency table can have its own
          # `version = ` line.)
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' rust/Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error file=rust/Cargo.toml::Input version $VERSION does not match rust/Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi

          # The release push fast-forwards main (see "Push release commit and
          # tag"), so the release commit must be built from main.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch Release from main (got $GITHUB_REF)"
            exit 1
          fi

          # A re-run for a version that is already tagged would fail at
          # `git tag` after the build; a published tag is never moved.
          # (ls-remote needs no credentials: the repository is public, as
          # the release download URLs in Package.swift require.)
          TAG="v$VERSION"
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$REMOTE_TAG" ] || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; bump rust/Cargo.toml for a new release, or see the recovery notes in release.yml if $TAG's release is incomplete"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      # The dtolnay/rust-toolchain SHA is its `stable` branch (the same one
      # check-upstream.yml pins); `toolchain:` overrides that branch's default.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          # The same targets as build.yml: every platform the XCFramework
          # ships (no x86_64-apple-tvos, a Tier 3 target; the tvOS and
          # visionOS Simulator slices are arm64 only).
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios-macabi,x86_64-apple-ios-macabi,aarch64-apple-tvos,aarch64-apple-tvos-sim,aarch64-apple-visionos,aarch64-apple-visionos-sim

      - name: Install cargo-swift (version pinned in scripts/build-local.sh)
        run: |
          CARGO_SWIFT_VERSION=$(sed -n 's/^CARGO_SWIFT_VERSION="\([^"]*\)"$/\1/p' scripts/build-local.sh)
          if [ -z "$CARGO_SWIFT_VERSION" ]; then
            echo "::error file=scripts/build-local.sh::CARGO_SWIFT_VERSION not found"
            exit 1
          fi
          cargo +"$RUST_STABLE" install cargo-swift --version "$CARGO_SWIFT_VERSION" --locked

      # No Swatinem/rust-cache here: caches on the default branch can be written
      # by jobs that run unreviewed build scripts (check-upstream's probe), and
      # this job builds the published binaries, so it always builds from a
      # clean target dir.
      - name: Check rust/Cargo.lock is up to date
        run: cargo +"$RUST_STABLE" metadata --locked --format-version 1 --manifest-path rust/Cargo.toml > /dev/null

      - name: Check THIRD_PARTY_NOTICES.md is up to date
        # The tag freezes it, so check before the build, as build.yml's
        # notices job does (cargo fetch + cargo metadata, no build).
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_STABLE }}
        run: python3 scripts/generate-third-party-notices.py --check

      # ===========================================
      # Build (iOS, macOS, Mac Catalyst, tvOS, visionOS; all stable Rust)
      # ===========================================
      - name: Use the pinned toolchain for the build
        # cargo-swift runs plain `cargo build` and `rustup target list`, so
        # the pinned toolchain must be the default one.
        run: rustup default "$RUST_STABLE"

      - name: Build XCFramework + stage bindings (all platforms)
        run: ./scripts/build-local.sh

      # ===========================================
      # Smoke test the build before anything is published. The tag is
      # never moved and pins this exact binary's checksum, while build.yml
      # tested a different build, so run the same checks against this one.
      # The root Package.swift uses ./SudachiSwift.xcframework when it exists,
      # so the packages below link the XCFramework just built. Any failure
      # fails this job, and `publish` doesn't run.
      # ===========================================
      - name: "Smoke test: SPM consumer fixture"
        run: |
          set -euo pipefail
          if [ ! -f SudachiSwift.xcframework/Info.plist ]; then
            echo "::error::SudachiSwift.xcframework/Info.plist not found after the build; the smoke test would run against the published binary."
            exit 1
          fi
          cd tests/spm-consumer
          swift run Verify

      - name: "Smoke test: BasicUsage with the V1 test dictionary"
        # Upstream's script checks the zip's sha256 and writes ./system.dic.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dict-v1"
          (cd "$RUNNER_TEMP/dict-v1" && sh "$GITHUB_WORKSPACE/sudachi.rs/fetch_dictionary.sh" "$SUDACHI_DICT_VERSION" small v1 "$SUDACHI_DICT_V1_SHA256")
          cd Examples/BasicUsage
          SUDACHI_DICT_PATH="$RUNNER_TEMP/dict-v1/system.dic" swift run BasicUsage

      - name: "Smoke test: Swift tests with the V1 test dictionary"
        # tests/SudachiSwiftTests, end-to-end tests included, as in
        # build.yml's test job. The consumer fixture step checked that the
        # XCFramework is at the repo root.
        run: SUDACHI_DICT_PATH="$RUNNER_TEMP/dict-v1/system.dic" swift test

      - name: "Smoke test: legacy V0 dictionary is rejected"
        # As in build.yml: Tokenizer.create must throw the "legacy V0" error
        # (the fixture exits non-zero otherwise). If upstream stops serving
        # the V0 fixture, skip with a warning rather than block the release.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dict-v0"
          if ! (cd "$RUNNER_TEMP/dict-v0" && sh "$GITHUB_WORKSPACE/sudachi.rs/fetch_dictionary.sh" "$SUDACHI_DICT_VERSION" small v0 "$SUDACHI_DICT_V0_SHA256"); then
            echo "::warning::Could not fetch the V0 fixture dictionary; skipping the legacy-format check."
            exit 0
          fi
          cd tests/spm-consumer
          SUDACHI_V0_DICT_PATH="$RUNNER_TEMP/dict-v0/system.dic" swift run Verify

      # The zip also ships Mac Catalyst, tvOS and visionOS slices; make sure
      # each one links. The simulator builds are arm64 only, like their
      # slices (see build.yml's verification builds).
      - name: "Smoke test: Mac Catalyst build"
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/dd-catalyst" \
            -skipPackagePluginValidation

      - name: "Smoke test: tvOS build"
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-tvos" \
            -skipPackagePluginValidation

      - name: "Smoke test: tvOS Simulator build (arm64)"
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-tvos" \
            -skipPackagePluginValidation \
            ARCHS=arm64

      - name: "Smoke test: visionOS build"
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-visionos" \
            -skipPackagePluginValidation

      - name: "Smoke test: visionOS Simulator build (arm64)"
        run: |
          xcodebuild build \
            -scheme SudachiSwift \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-visionos" \
            -skipPackagePluginValidation \
            ARCHS=arm64

      - name: Package XCFramework
        run: |
          set -euo pipefail
          zip -r SudachiSwift.xcframework.zip SudachiSwift.xcframework
          # For the log only: `publish` recomputes the checksum it commits.
          echo "Checksum: $(swift package compute-checksum SudachiSwift.xcframework.zip)"

      - name: Stage bindings and resources for publish
        # `publish` commits these next to Package.swift, as the files the
        # XCFramework was built and tested with.
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-sources"
          mkdir -p "$RUNNER_TEMP/release-sources"
          cp Sources/SudachiSwift/sudachi_swift.swift "$RUNNER_TEMP/release-sources/sudachi_swift.swift"
          cp -R Sources/SudachiSwift/Resources "$RUNNER_TEMP/release-sources/Resources"

      # Also the recovery copy of the exact zip (see Recovery at the top).
      - name: Upload zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ env.VERSION }}-xcframework
          path: SudachiSwift.xcframework.zip
          if-no-files-found: error
          # Already a zip.
          compression-level: 0

      - name: Upload bindings and resources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ env.VERSION }}-sources
          path: ${{ runner.temp }}/release-sources/
          if-no-files-found: error

  # ===========================================
  # publish: commit, tag, push and create the GitHub release. The only job
  # with a write token, so it runs no third-party build code on a fresh
  # runner: no cargo, swift or repository scripts, only git, perl, unzip and
  # the runner's standard tools, plus the pinned checkout, download-artifact
  # and release actions.
  # It takes only data from `build`: the zip, the bindings and resources to
  # commit, and the version output it re-validates; the checksum it commits
  # is computed here from the zip it publishes.
  # ===========================================
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Passed via env so the raw values are never spliced into a script.
      VERSION_INPUT: ${{ github.event.inputs.version }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit `build` built and tested. No submodules: the release
          # commit doesn't change the sudachi.rs gitlink.
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Keep the write token out of .git/config: only the push step gets
          # it (GH_TOKEN, passed to that one git command), plus the release
          # step (softprops/action-gh-release's default token).
          persist-credentials: false

      - name: Validate version, branch and tag
        # The build job's checks again: its outputs come from a job that ran
        # third-party code, and a tag may have appeared during the build.
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in format X.Y.Z (e.g., 0.7.0), got '$VERSION'"
            exit 1
          fi
          if [ "$BUILD_VERSION" != "$VERSION" ]; then
            echo "::error::The build job reported a different version than the input $VERSION"
            exit 1
          fi

          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' rust/Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error file=rust/Cargo.toml::Input version $VERSION does not match rust/Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch Release from main (got $GITHUB_REF)"
            exit 1
          fi
          TAG="v$VERSION"
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$REMOTE_TAG" ] || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; see the recovery notes in release.yml"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ env.VERSION }}-xcframework
          path: ${{ runner.temp }}/release/xcframework

      - name: Download bindings and resources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ env.VERSION }}-sources
          path: ${{ runner.temp }}/release/sources

      - name: Commit and tag the release (local only)
        # The release commit goes on top of the built commit; main is
        # fast-forwarded to it below. Nothing is pushed here.
        run: |
          set -euo pipefail
          REL="$RUNNER_TEMP/release"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # No hooks for any git command in this job (none can have been
          # planted in this fresh checkout; this keeps it that way).
          git config core.hooksPath /dev/null

          # Prints the checksum SwiftPM expects for a binaryTarget zip (what
          # `swift package compute-checksum` prints: the file's SHA-256, in
          # hex) after checking the zip holds $2/Info.plist at its top
          # level; otherwise says why on stderr and fails (the caller picks
          # the annotation). Explicit returns: it runs in `$(...)` and as an
          # `if` condition, where `set -e` doesn't apply.
          zip_checksum() {
            local zip="$1" dir="$2" listing sum
            if [ ! -f "$zip" ]; then
              echo "$zip not found" >&2
              return 1
            fi
            listing=$(unzip -Z1 "$zip") || return 1
            if ! printf '%s\n' "$listing" | grep -Fx "$dir/Info.plist" >/dev/null; then
              echo "$zip does not contain $dir/Info.plist" >&2
              return 1
            fi
            if ! printf '%s\n' "$listing" | awk -v p="$dir/" 'index($0, p) != 1 { bad = 1 } END { exit bad }'; then
              echo "$zip has entries outside $dir/" >&2
              return 1
            fi
            sum=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
            if [[ ! "$sum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Could not compute the checksum of $zip" >&2
              return 1
            fi
            printf '%s\n' "$sum"
          }

          # Sets Package.swift's `let version` and `let checksum`; fails
          # unless each, and the release URL's zip name, occurs exactly once.
          # (perl, not `sed -i`, whose syntax differs between GNU and BSD.)
          set_package() {
            PKG_VERSION="$1" PKG_CHECKSUM="$2" perl -0777 -pi -e '
              my $v = s/^let version = "[^"]*"$/let version = "$ENV{PKG_VERSION}"/mg;
              my $c = s/^let checksum = "[^"]*"$/let checksum = "$ENV{PKG_CHECKSUM}"/mg;
              my $z = () = m{/SudachiSwift\.xcframework\.zip"}g;
              die sprintf("Package.swift: expected one version, checksum and zip URL, found %d, %d, %d\n",
                $v || 0, $c || 0, $z || 0) unless $v == 1 && $c == 1 && $z == 1;
            ' Package.swift
            grep -E '^let (version|checksum) = |xcframework\.zip"' Package.swift
          }

          if ! RELEASE_CHECKSUM=$(zip_checksum "$REL/xcframework/SudachiSwift.xcframework.zip" SudachiSwift.xcframework); then
            echo "::error::The zip artifact is missing or unusable (see above)"
            exit 1
          fi
          echo "Checksum: $RELEASE_CHECKSUM"
          set_package "$VERSION" "$RELEASE_CHECKSUM"

          # The generated bindings and bundled resources the build staged
          # (see build-local.sh); regular files only.
          SRC="$REL/sources"
          RESOURCES=(char.def rewrite.def sudachi.json unk.def)
          EXPECTED=$( { printf '%s\n' . ./Resources ./sudachi_swift.swift; printf './Resources/%s\n' "${RESOURCES[@]}"; } | LC_ALL=C sort)
          ACTUAL=$(cd "$SRC" && find . | LC_ALL=C sort)
          if [ "$ACTUAL" != "$EXPECTED" ] || [ -L "$SRC/Resources" ]; then
            echo "::error::The sources artifact doesn't hold exactly sudachi_swift.swift and Resources/{${RESOURCES[*]}}"
            printf '%s\n' "$ACTUAL"
            exit 1
          fi
          for f in sudachi_swift.swift "${RESOURCES[@]/#/Resources/}"; do
            if [ ! -f "$SRC/$f" ] || [ -L "$SRC/$f" ]; then
              echo "::error::Not a regular file in the sources artifact: $f"
              exit 1
            fi
          done
          cp "$SRC/sudachi_swift.swift" Sources/SudachiSwift/sudachi_swift.swift
          for f in "${RESOURCES[@]}"; do
            cp "$SRC/Resources/$f" "Sources/SudachiSwift/Resources/$f"
          done

          git add Package.swift \
                  Sources/SudachiSwift/Resources/ \
                  Sources/SudachiSwift/sudachi_swift.swift
          git commit -q -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git --no-pager show --stat --format='%H %s' HEAD
          echo "RELEASE_CHECKSUM=$RELEASE_CHECKSUM" >> "$GITHUB_ENV"

      # ===========================================
      # Publish: push, then the GitHub Release right away, so the
      # binaryTarget URL in the tagged Package.swift resolves.
      # ===========================================
      - name: Push release commit and tag
        env:
          # The only step that gets the write token for git (see checkout).
          # It goes to the push only, as the same header actions/checkout would
          # have stored in .git/config, via GIT_CONFIG_* rather than
          # `git -c` so it isn't on a command line.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-parse --verify "refs/tags/v$VERSION^{commit}")
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$BASIC_AUTH"
          # Atomic: if main moved since the dispatch, neither main nor the
          # tag is updated (a plain `git push origin main --tags` would still
          # push the tag while main is rejected).
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $BASIC_AUTH" \
            git push --atomic origin "$RELEASE_COMMIT:refs/heads/main" "refs/tags/v$VERSION"

      - name: Create GitHub Release
        # The body recommends `exact:` because upstream sudachi.rs 0.x releases
        # may change behavior even in patch releases; revisit once sudachi.rs
        # reaches 1.0.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          files: ${{ runner.temp }}/release/xcframework/SudachiSwift.xcframework.zip
          fail_on_unmatched_files: true
          body: |
            ## SudachiSwift v${{ env.VERSION }}

            Swift bindings for sudachi.rs Japanese morphological analyzer.

            ### Installation

            ```swift
            .package(url: "https://github.com/${{ github.repository }}", exact: "${{ env.VERSION }}")
            ```
            Pin the exact version: upstream sudachi.rs 0.x releases may change tokenization behavior even in patch releases.

            **Platforms:** iOS 13+, macOS 10.15+, Mac Catalyst 13+, tvOS 13+ and visionOS 1+, all in this one XCFramework. The tvOS and visionOS Simulator slices are arm64 only (Apple silicon Macs); see [tvOS and visionOS Simulator](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#tvos-and-visionos-simulator).

            **Dictionary:** a V1-format SudachiDict dictionary is required; legacy V0 dictionaries are rejected. See [Dictionary Setup](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#dictionary-setup), and [Upgrading from 0.6.x](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#upgrading-from-06x) if you are coming from 0.6.

            **Updating from an earlier version:** if the first build after updating fails with `…sudachi_swiftFFI.h has been modified since the module file … was built`, clean once: Xcode **Product → Clean Build Folder**, or `swift package clean`.

            **Licenses:** the XCFramework statically links third-party Rust crates; their notices are in [THIRD_PARTY_NOTICES.md](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/THIRD_PARTY_NOTICES.md).

            ### Checksum
            - `${{ env.RELEASE_CHECKSUM }}`

          generate_release_notes: true
