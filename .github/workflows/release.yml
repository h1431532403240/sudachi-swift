name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.7.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Same image as build.yml; macos-14 is being retired
    # (https://github.com/actions/runner-images/issues/13518).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate version format
        env:
          # Passed via env so the raw input is never spliced into the script.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 0.7.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing version: $VERSION"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install cargo-swift (version pinned in scripts/build-local.sh)
        # +stable: the nightly step above made nightly the default toolchain.
        run: |
          CARGO_SWIFT_VERSION=$(sed -n 's/^CARGO_SWIFT_VERSION="\([^"]*\)"$/\1/p' scripts/build-local.sh)
          if [ -z "$CARGO_SWIFT_VERSION" ]; then
            echo "::error file=scripts/build-local.sh::CARGO_SWIFT_VERSION not found"
            exit 1
          fi
          cargo +stable install cargo-swift --version "$CARGO_SWIFT_VERSION" --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # ===========================================
      # Build Stable (iOS + macOS)
      # ===========================================
      - name: Use stable toolchain for build
        run: rustup default stable

      - name: Build stable XCFramework + stage bindings
        run: ./scripts/build-local.sh

      - name: Snapshot stable artifacts
        # Nightly build below clobbers SudachiSwift.xcframework + the staged
        # bindings; stash them so we can restore without a third build.
        run: |
          mkdir -p .stable-stash
          cp -R SudachiSwift.xcframework .stable-stash/SudachiSwift.xcframework
          cp Sources/SudachiSwift/sudachi_swift.swift .stable-stash/sudachi_swift.swift

      - name: Package stable XCFramework
        run: |
          zip -r SudachiSwift.xcframework.zip SudachiSwift.xcframework
          CHECKSUM=$(swift package compute-checksum SudachiSwift.xcframework.zip)
          echo "STABLE_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "Stable checksum: $CHECKSUM"

      # ===========================================
      # Publish stable: tag, then the GitHub Release right away, so the
      # binaryTarget URL in the tagged Package.swift resolves before the
      # (slow, optional) nightly build starts.
      # ===========================================
      - name: Update Package.swift for stable release
        run: |
          sed -i '' "s/let version = \".*\"/let version = \"$VERSION\"/" Package.swift
          sed -i '' "s/let checksum = \".*\"/let checksum = \"$STABLE_CHECKSUM\"/" Package.swift

          echo "Updated Package.swift for stable:"
          head -20 Package.swift

      - name: Commit and tag stable release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Package.swift \
                  Sources/SudachiSwift/Resources/ \
                  Sources/SudachiSwift/sudachi_swift.swift
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin main --tags

      - name: Create stable GitHub Release
        # The body recommends `exact:` because upstream says 0.7.x may change
        # behavior even in patch releases; revisit once sudachi.rs reaches 1.0.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          files: SudachiSwift.xcframework.zip
          fail_on_unmatched_files: true
          body: |
            ## SudachiSwift v${{ env.VERSION }}

            Swift bindings for sudachi.rs Japanese morphological analyzer.

            ### Installation

            **Stable (iOS + macOS):**
            ```swift
            .package(url: "https://github.com/${{ github.repository }}", exact: "${{ env.VERSION }}")
            ```
            Pin the exact version: sudachi.rs 0.7.x may change tokenization behavior even in patch releases.

            **Dictionary:** a V1-format SudachiDict dictionary is required; legacy V0 dictionaries are rejected. See [Dictionary Setup](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#dictionary-setup), and [Upgrading from 0.6.x](https://github.com/${{ github.repository }}/blob/v${{ env.VERSION }}/README.md#upgrading-from-06x) if you are coming from 0.6.

            **tvOS / visionOS:** when the Rust nightly build succeeds, a separate `v${{ env.VERSION }}-nightly` prerelease is published under [Releases](https://github.com/${{ github.repository }}/releases).

            ### Checksum
            - Stable: `${{ env.STABLE_CHECKSUM }}`

          generate_release_notes: true

      # ===========================================
      # Build Nightly (All Platforms) - May fail
      # ===========================================
      - name: Build nightly XCFramework (all platforms)
        id: nightly-build
        continue-on-error: true
        env:
          NIGHTLY: "1"
          PLATFORMS: "macos ios tvos visionos"
        run: ./scripts/build-local.sh

      - name: Package nightly XCFramework
        if: steps.nightly-build.outcome == 'success'
        run: |
          mv SudachiSwift.xcframework SudachiSwift-nightly.xcframework
          zip -r SudachiSwift-nightly.xcframework.zip SudachiSwift-nightly.xcframework
          CHECKSUM=$(swift package compute-checksum SudachiSwift-nightly.xcframework.zip)
          echo "NIGHTLY_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "NIGHTLY_AVAILABLE=true" >> "$GITHUB_ENV"
          echo "Nightly checksum: $CHECKSUM"

      - name: Mark nightly as unavailable
        if: steps.nightly-build.outcome != 'success'
        run: |
          echo "NIGHTLY_AVAILABLE=false" >> "$GITHUB_ENV"
          echo "Nightly build failed, skipping nightly release"

      - name: Restore stable artifacts from snapshot
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          rm -rf SudachiSwift.xcframework
          cp -R .stable-stash/SudachiSwift.xcframework SudachiSwift.xcframework
          cp .stable-stash/sudachi_swift.swift Sources/SudachiSwift/sudachi_swift.swift

      # ===========================================
      # Create nightly tag + prerelease (if build succeeded)
      # ===========================================
      - name: Update Package.swift for nightly release
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          sed -i '' "s/let version = \".*\"/let version = \"$VERSION-nightly\"/" Package.swift
          sed -i '' "s/let checksum = \".*\"/let checksum = \"$NIGHTLY_CHECKSUM\"/" Package.swift
          sed -i '' "s/SudachiSwift.xcframework.zip/SudachiSwift-nightly.xcframework.zip/" Package.swift

          echo "Updated Package.swift for nightly:"
          head -20 Package.swift

      - name: Commit and tag nightly release
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          git add Package.swift Sources/SudachiSwift/sudachi_swift.swift
          git commit -m "chore: release v$VERSION-nightly"
          git tag "v$VERSION-nightly"
          git push origin main --tags

      - name: Create nightly GitHub prerelease
        # The nightly tag's Package.swift downloads
        # releases/download/v<version>-nightly/SudachiSwift-nightly.xcframework.zip,
        # so the asset must live on a release for that tag.
        if: env.NIGHTLY_AVAILABLE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}-nightly
          prerelease: true
          make_latest: false
          files: SudachiSwift-nightly.xcframework.zip
          fail_on_unmatched_files: true
          body: |
            ## SudachiSwift v${{ env.VERSION }}-nightly

            Same sources as [v${{ env.VERSION }}](https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}), with the XCFramework built by the Rust nightly compiler (`-Z build-std`) so it also covers tvOS and visionOS.

            **Nightly (iOS, macOS, tvOS, visionOS):**
            ```swift
            .package(url: "https://github.com/${{ github.repository }}", exact: "${{ env.VERSION }}-nightly")
            ```
            > ⚠️ Nightly builds use Rust nightly compiler and may be unstable

            A V1-format dictionary is required, as for the stable release.

            ### Checksum
            - Nightly: `${{ env.NIGHTLY_CHECKSUM }}`

      # ===========================================
      # Restore Package.swift to stable (keep main stable)
      # ===========================================
      - name: Restore Package.swift to stable
        if: env.NIGHTLY_AVAILABLE == 'true'
        run: |
          sed -i '' "s/let version = \".*\"/let version = \"$VERSION\"/" Package.swift
          sed -i '' "s/let checksum = \".*\"/let checksum = \"$STABLE_CHECKSUM\"/" Package.swift
          sed -i '' "s/SudachiSwift-nightly.xcframework.zip/SudachiSwift.xcframework.zip/" Package.swift

          git add Package.swift
          git commit -m "chore: restore Package.swift to stable after nightly tag"
          git push origin main
